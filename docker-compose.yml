# Ambiente local do Billing Service: API + PostgreSQL + RabbitMQ.
#   cp .env.example .env && docker compose up --build
# Portas no host: API 8002 · Postgres 5434 · RabbitMQ 5673 (painel em 15673).
services:
  api:
    build: .
    env_file: .env
    # Aplica as migrations pendentes e depois sobe a API.
    command: ["sh", "-c", "python -m app.infrastructure.migrations && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autogiro_billing
      POSTGRES_USER: autogiro
      POSTGRES_PASSWORD: autogiro
    ports:
      - "5434:5432"
    volumes:
      - billing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autogiro -d autogiro_billing"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

volumes:
  billing-db:
