# FORMA do Secret do billing-service; os valores são exemplos e não funcionam. Este
# arquivo não entra no kustomization: a pipeline cria o Secret a partir dos secrets
# do GitHub Actions, que nunca tocam o repositório.
#
# Criação manual:
#   kubectl -n autogiro create secret generic billing-service-secret \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=MERCADOPAGO_ACCESS_TOKEN="$MERCADOPAGO_ACCESS_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: autogiro
type: Opaque
stringData:
  # Banco próprio no Neon: saída `database_url` do terraform/ deste repositório.
  DATABASE_URL: "postgresql+asyncpg://autogiro_billing_app:senha@ep-xxx.us-east-1.aws.neon.tech/autogiro_billing?ssl=require"
  # Access Token das credenciais de teste do Mercado Pago.
  MERCADOPAGO_ACCESS_TOKEN: "APP_USR-..."
