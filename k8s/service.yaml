apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: autogiro
  labels:
    app: billing-service
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
    - name: http
      port: 80
      targetPort: http
# Acesso direto (Swagger em /docs):
#   kubectl -n autogiro port-forward svc/billing-service 8000:80
